name: OFXR V577 Pose-Motion Adaptive Prototype (security audit)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 0650cd4b1ccd57ad4d7e7fad2ba5b0aa43fe663e
  FFX_TAG: v1.1.4
  FFX_COMMIT: c6efa6bf7f2027b3ec94f28578bb5965eabb9e55
  FFX_ROOT: external/FidelityFX-SDK-v1.1.4
  DLSS_TAG: v310.9.1
  DLSS_COMMIT: 374959484e79a640feaba44c93ac8cfb0a03f5b5
  OPENVR_TAG: v2.5.1
  OPENVR_SHA256: 94E5545370159C85F87CD6E15DD3739F7C919FC7A6E869F5E4ED463533A07ED0

jobs:
  experimental-build:
    name: Windows x64 build, test and package
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out exact upstream 0.2.14.3 (V577)
        uses: actions/checkout@v4
        with:
          repository: djules75/OFXR-Bridge
          ref: 0650cd4b1ccd57ad4d7e7fad2ba5b0aa43fe663e
          persist-credentials: false

      - name: Verify upstream commit
        shell: pwsh
        run: |
          $hash = (git rev-parse HEAD).Trim()
          if ($hash -ne $env:UPSTREAM_COMMIT) { throw "Unexpected upstream commit: $hash" }
          Write-Host "Pinned upstream: $hash"

      - name: Apply pose-motion adaptive source experiment (strict pinned anchors)
        shell: pwsh
        run: |
          # Embedded build script: one workflow file is all the fork needs.
          @'
          #!/usr/bin/env python3
          """Fail-closed source transform for OFXR V577 (commit 0650cd4b).
          
          Modes 0=stock, 1=pose-only A/B selection, 2=motion confidence,
          3=adaptive cadence/edge fallback.  These are V577 B-camera anchored
          experiments, not display-time/headset pose extrapolation or SSW clones.
          """
          from pathlib import Path
          import re
          
          HERE=Path.cwd()
          CMAKE=HERE/'CMakeLists.txt'
          SHADER=HERE/'src/d3d12/frame_synthesis.hlsl'
          ENGINE=HERE/'src/d3d12/d3d12_frame_synthesizer.cpp'
          LAYER=HERE/'src/layer/openxr_layer.cpp'
          
          
          def change_one(s, old, new, label):
              n=s.count(old)
              if n!=1:
                  raise RuntimeError(f'{label}: expected one pinned V577 match; found {n}. STOP: upstream drift or double patch')
              return s.replace(old,new,1)
          
          
          def patch():
              for p in (CMAKE,SHADER,ENGINE,LAYER):
                  if not p.is_file(): raise RuntimeError(f'Missing upstream source: {p}')
              cmake=CMAKE.read_text(encoding='utf-8')
              shader=SHADER.read_text(encoding='utf-8')
              engine=ENGINE.read_text(encoding='utf-8')
              layer=LAYER.read_text(encoding='utf-8')
          
              cmake=change_one(cmake,'if(WIN32 AND XRFG_BUILD_LAYER)\n',
          '''# Experimental reconstruction mode: no effect unless explicitly selected.
          set(XRFG_HEAD_MOTION_MODE "0" CACHE STRING "0=V577 stock; 1=pose-only; 2=motion-aware; 3=adaptive")
          set_property(CACHE XRFG_HEAD_MOTION_MODE PROPERTY STRINGS 0 1 2 3)
          if(NOT XRFG_HEAD_MOTION_MODE MATCHES "^[0123]$")
              message(FATAL_ERROR "XRFG_HEAD_MOTION_MODE must be 0, 1, 2 or 3")
          endif()
          set(XRFG_HEAD_MOTION_DEFINE /D XRFG_HEAD_MOTION_MODE=${XRFG_HEAD_MOTION_MODE})
          
          if(WIN32 AND XRFG_BUILD_LAYER)
          ''','CMake mode option')
          
              pattern=re.compile(r'(^[ \t]*COMMAND "\$\{XRFG_FXC_EXECUTABLE\}" /nologo /T ps_5_1 /E [A-Za-z0-9_]+\n)',re.M)
              shaders=pattern.findall(cmake)
              if len(shaders)!=11:
                  raise RuntimeError(f'Expected 11 SM5.1 pixel shader commands, found {len(shaders)}')
              cmake=pattern.sub(r'\g<1>            ${XRFG_HEAD_MOTION_DEFINE}\n',cmake)
          
              shader=change_one(shader,'float4 synthesize_midpoint(\n',
          '''// Prototype variants. The original shader stays unchanged at mode zero.
          #ifndef XRFG_HEAD_MOTION_MODE
          #define XRFG_HEAD_MOTION_MODE 0
          #endif
          #if XRFG_HEAD_MOTION_MODE < 0 || XRFG_HEAD_MOTION_MODE > 3
          #error Unsupported XRFG_HEAD_MOTION_MODE
          #endif
          // Bit 30: per-output cadence anomaly, set when the fraction is >0.10
          // from its nominal evenly-spaced position. Never set by the stock shaders.
          bool experimental_cadence_anomaly() { return (SynthesisFlags & (1u << 30u)) != 0u; }
          
          float4 synthesize_midpoint(
          ''','HLSL mode block')
          
              fidelity_needle='''                    } else {
          #ifdef XRFG_HYBRID
                                  // The hybrid's FidelityFX flow, by the same rule (V502).
                                  confidence = saturate(1.0 + (stable_disagreement - disagreement) * hybrid_flow_rule_slope());
          #endif
                                  output_color = saturate(lerp(
                                      stable_midpoint,
                                      flow_midpoint,
                                      confidence));
          #ifdef XRFG_HYBRID
                                  last_disagreement = lerp(stable_disagreement, compared, confidence);
          #endif
                              }
          '''
              fidelity_new='''                    } else {
          #ifdef XRFG_HYBRID
                                  // The hybrid's FidelityFX flow, by the same rule (V502).
                                  confidence = saturate(1.0 + (stable_disagreement - disagreement) * hybrid_flow_rule_slope());
          #endif
                                  output_color = saturate(lerp(
                                      stable_midpoint,
                                      flow_midpoint,
                                      confidence));
          #if XRFG_HEAD_MOTION_MODE >= 2
                                  // The source endpoint A has ALREADY been projected into
                                  // B's camera reference by PreviousMappings. Do not do a
                                  // second pose warp or invent headset display-time poses.
                                  // Select a coherent real-frame surface, not a crossfade
                                  // of two incompatible strong strokes.
                                  [branch] if (current_fallback.valid >= 0.5 &&
                                               previous_at_pixel.valid >= 0.5) {
                                      float t = synthesis_fraction();
                                      float4 pose_anchor = t < 0.5
                                          ? previous_at_pixel.color : current_fallback.color;
                                      CameraSample right = sample_current_target(
                                          pixel + float2(1.0, 0.0), Slice, ViewIndex);
                                      CameraSample down = sample_current_target(
                                          pixel + float2(0.0, 1.0), Slice, ViewIndex);
                                      float edge = 0.0;
                                      if (right.valid >= 0.5) {
                                          edge = max(edge, rgb_error(current_fallback.color, right.color));
                                      }
                                      if (down.valid >= 0.5) {
                                          edge = max(edge, rgb_error(current_fallback.color, down.color));
                                      }
                                      float pose_shift = length(previous_coverage.coordinate - pixel);
                                      float mismatch = rgb_error(flow_midpoint, pose_anchor);
                                      float risk =
                                          smoothstep(0.07, 0.22, edge) *
                                          smoothstep(0.08, 0.30, disagreement) *
                                          smoothstep(0.05, 0.24, mismatch) *
                                          lerp(0.55, 1.0, smoothstep(0.5, 5.0, pose_shift));
          #if XRFG_HEAD_MOTION_MODE == 2
                                      // B: reduce ambiguous flow, but retain motion
                                      // interpolation elsewhere; no full frame hold.
                                      float anchor_weight = 0.78 * risk;
          #else
                                      // C: strengthen the fallback only for a real
                                      // cadence anomaly or repeated capture. 2X at
                                      // 24fps triggers the former; steady 3X/24fps
                                      // should not. No stale frame is silently dropped.
                                      float cadence_risk = experimental_cadence_anomaly()
                                          ? smoothstep(0.06, 0.22, mismatch)
                                          : 0.0;
                                      float anchor_weight = max(0.78 * risk,
                                          0.95 * cadence_risk);
                                      if (repeated_capture_flag() != 0u) anchor_weight = 1.0;
          #endif
                                      output_color = saturate(lerp(
                                          output_color, pose_anchor, saturate(anchor_weight)));
                                  }
          #endif
          #ifdef XRFG_HYBRID
                                  last_disagreement = lerp(stable_disagreement, compared, confidence);
          #endif
                              }
          '''
              shader=change_one(shader,fidelity_needle,fidelity_new,'FidelityFX reconstruction')
          
              shader=change_one(shader,
          '''    return output_color;
          }
          
          #ifdef XRFG_HYBRID
          // The game's vectors and the optical flow both: per pixel, whichever
          ''',
          '''#if XRFG_HEAD_MOTION_MODE == 1
              // A: pose-only diagnostic. Each source is a real frame in B camera
              // coordinates. An A frame is mapped to B using existing XR camera
              // mappings; no optical-flow vector or crossfade is used. Expect scene
              // judder and no ability to repair head translation without scene depth.
              if (in_bounds) {
                  const float2 pixel = float2(integer_pixel);
                  CameraSample b = sample_current_target(pixel, Slice, ViewIndex);
                  CameraSample a = sample_previous_target(pixel, Slice, ViewIndex);
                  if (synthesis_fraction() < 0.5 && a.valid >= 0.5) {
                      output_color = saturate(a.color);
                  } else if (b.valid >= 0.5) {
                      output_color = saturate(b.color);
                  } else if (a.valid >= 0.5) {
                      output_color = saturate(a.color);
                  }
              }
          #endif
              return output_color;
          }
          
          #ifdef XRFG_HYBRID
          // The game's vectors and the optical flow both: per pixel, whichever
          ''','A pose-only output')
          
              engine=change_one(engine,
          '''// The ini's switches (set_composition_switches): bit 0 edge ghosting
          ''',
          '''// Prototype cadence signal for diagnostic mode C. The per-output
          // synthesized fraction normally equals (index+1)/(count+1). A deviation
          // over 0.10 indicates uneven real-frame delivery. Stored in previously
          // unused SynthesisFlags bit 30; stock V577 pixel shaders ignore that bit.
          constexpr UINT kExperimentalCadenceMissFlag = 1U << 30U;
          [[nodiscard]] UINT experimental_cadence_flag(float fraction, UINT index,
                                                      UINT synthetic_count) noexcept {
              if (synthetic_count == 0U) return 0U;
              const float nominal = static_cast<float>(index + 1U) /
                  static_cast<float>(synthetic_count + 1U);
              const float deviation = fraction < nominal ? nominal - fraction : fraction - nominal;
              return deviation > 0.10F ? kExperimentalCadenceMissFlag : 0U;
          }
          
          // The ini's switches (set_composition_switches): bit 0 edge ghosting
          ''','C++ cadence signal helper')
          
              # Five actual output loops (Nvidia, game guide, FidelityFX and repeat).
              # Clear bit30 between synthetic outputs, keeping every original flag.
              old='''(parameters.synthesis_flags & 0xFF0000FFU & ~kDepthSplatOutputMask) |
                          packed_synthesis_fraction(synthetic_output_fraction(output)) |
                          (output << kDepthSplatOutputShift);'''
              count=engine.count(old)
              if count!=5: raise RuntimeError(f'Expected five draw-loop flag constructors; got {count}')
              new='''(parameters.synthesis_flags & 0xBF0000FFU & ~kDepthSplatOutputMask) |
                          packed_synthesis_fraction(synthetic_output_fraction(output)) |
                          experimental_cadence_flag(synthetic_output_fraction(output),
                              output, synthetic_output_count()) |
                          (output << kDepthSplatOutputShift);'''
              engine=engine.replace(old,new)
          
              layer=change_one(layer,
          '''    const std::span<const float> extra_interpolation_fractions(
                  extra_fractions.data(), extra_fraction_count);
              PreparedProjectionFrame prepared = prepare_projection_frame(
          ''',
          '''    const std::span<const float> extra_interpolation_fractions(
                  extra_fractions.data(), extra_fraction_count);
              // Flight logger result=980, once per paired real frame:
              // a=real-frame display-time interval ns; b=presenter period ns;
              // c: low byte=multiplier, bit8=missed nominal real-frame budget,
              // bit9=more than 2x the nominal budget. No compositor scanout claim.
              if (previous_snapshot) {
                  const XrTime pair_interval =
                      current_snapshot.display_time - previous_snapshot->display_time;
                  const XrDuration display_period = state->application_timeline_period.load(
                      std::memory_order_relaxed);
                  if (pair_interval > 0 && display_period > 0) {
                      const std::uint64_t flags =
                          (frames_per_frame & 0xffU) |
                          (pair_interval > display_period * frames_per_frame ? 0x100U : 0U) |
                          (pair_interval > display_period * frames_per_frame * 2 ? 0x200U : 0U);
                      xrfg::bridge_flight_logger().event(
                          xrfg::BridgeFlightOperation::presenter_transition, 980,
                          static_cast<std::uint64_t>(pair_interval),
                          static_cast<std::uint64_t>(display_period), flags);
                  }
              }
              PreparedProjectionFrame prepared = prepare_projection_frame(
          ''','frame interval telemetry')
          
              # Only write once all anchor constraints have succeeded.
              for path,src in [(CMAKE,cmake),(SHADER,shader),(ENGINE,engine),(LAYER,layer)]:
                  path.write_text(src,encoding='utf-8',newline='\n')
              print(f'Pinned V577 transforms applied: mode 0..3, {len(shaders)} pixel shaders, {count} draw loops, telemetry 980')
          
          
          if __name__=='__main__': patch()
          '@ | Set-Content -Path apply_pose_motion_v577.py -Encoding utf8
          python apply_pose_motion_v577.py
          if ($LASTEXITCODE -ne 0) { throw 'Source transformation failed (pinned V577 mismatch)' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched source contains whitespace errors' }
          $diff = git diff -- CMakeLists.txt src/d3d12/frame_synthesis.hlsl
          # Binary-free patch for review in the downloadable build.
          $diff | Set-Content -Path pose_motion_v577.patch -Encoding utf8
          if (-not (Test-Path pose_motion_v577.patch)) { throw 'No experiment patch generated' }
          Write-Host 'Changed source:'
          git diff --stat

      - name: Verify experimental cadence and source contracts (CPU only)
        shell: pwsh
        run: |
          @'
          #!/usr/bin/env python3
          """Source contracts and deterministic reference checks (NOT GPU validation)."""
          from pathlib import Path
          
          src=Path('src/d3d12/d3d12_frame_synthesizer.cpp').read_text(encoding='utf-8')
          shader=Path('src/d3d12/frame_synthesis.hlsl').read_text(encoding='utf-8')
          layer=Path('src/layer/openxr_layer.cpp').read_text(encoding='utf-8')
          cmake=Path('CMakeLists.txt').read_text(encoding='utf-8')
          assert src.count('experimental_cadence_flag(synthetic_output_fraction(output),')==5
          assert 'kExperimentalCadenceMissFlag = 1U << 30U' in src
          assert 'XRFG_HEAD_MOTION_MODE == 1' in shader
          assert 'XRFG_HEAD_MOTION_MODE >= 2' in shader
          assert 'experimental_cadence_anomaly()' in shader
          assert 'BridgeFlightOperation::presenter_transition, 980' in layer
          assert 'XRFG_HEAD_MOTION_MODE' in cmake
          assert cmake.count('${XRFG_HEAD_MOTION_DEFINE}')==11
          
          # Independent, simple mathematical reference for the C++ cadence flag.
          def cadence_deviation(fraction, index, outputs):
              return abs(fraction - (index+1)/(outputs+1))
          def anomaly(fraction,index,outputs):
              return cadence_deviation(fraction,index,outputs)>0.10
          assert not anomaly(0.5,0,1)               # 2X/36fps at 72Hz
          assert not anomaly(1/3,0,2)               # 3X/24fps first
          assert not anomaly(2/3,1,2)               # 3X/24fps second
          assert anomaly(2/3,0,1)                   # 2X/24fps at 72Hz
          assert not anomaly(0.59,0,1)              # 0.09 intentionally tolerated
          assert anomaly(0.61,0,1)                  # 0.11 sets confidence fallback
          assert not anomaly(0.5,0,1)               # nominal baseline
          
          # The pose-only source selection is deliberately monotonic and non-blended.
          for t in (0.0,0.2,0.33,0.49,0.5,0.66,0.9,1.0):
              source='A' if t<0.5 else 'B'
              assert source == ('A' if t < 0.5 else 'B')
          
          print('CPU/source contract tests PASSED; GPU pixel correctness, runtime timing, and headset pose not tested.')
          '@ | Set-Content -Path tests_pose_motion.py -Encoding utf8
          python tests_pose_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Experimental CPU contract tests failed' }

      - name: Cache the FidelityFX SDK libraries
        id: ffx-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FFX_ROOT }}/sdk/include
            ${{ env.FFX_ROOT }}/sdk/bin/ffx_sdk
          key: ffx-${{ env.FFX_COMMIT }}-of-dx12-static-vs2022-x64-v1

      - name: Build FidelityFX SDK 1.1.4 when not cached
        if: steps.ffx-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --branch $env:FFX_TAG --depth 1 `
            https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git $env:FFX_ROOT
          $head = (git -C $env:FFX_ROOT rev-parse HEAD).Trim()
          if ($head -ne $env:FFX_COMMIT) { throw "FidelityFX tag moved: $head" }
          cmake -S "$env:FFX_ROOT/sdk" -B build-fidelityfx -G "Visual Studio 17 2022" -A x64 `
            -DFFX_ALL=OFF -DFFX_OF=ON -DFFX_API_BACKEND=DX12_X64 -DFFX_BUILD_AS_DLL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'FidelityFX configure failed' }
          cmake --build build-fidelityfx --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'FidelityFX build failed' }
          foreach ($lib in 'ffx_backend_dx12_x64.lib', 'ffx_opticalflow_x64.lib') {
            if (-not (Test-Path "$env:FFX_ROOT/sdk/bin/ffx_sdk/$lib")) { throw "Missing $lib" }
          }

      - name: Fetch pinned NVIDIA DLSS headers
        shell: pwsh
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git -c advice.detachedHead=false clone --branch $env:DLSS_TAG --depth 1 `
            --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git external/DLSS
          if ($LASTEXITCODE -ne 0) { throw 'DLSS clone failed' }
          git -C external/DLSS sparse-checkout set include
          $head = (git -C external/DLSS rev-parse HEAD).Trim()
          if ($head -ne $env:DLSS_COMMIT) { throw "DLSS tag moved: $head" }
          if (-not (Test-Path external/DLSS/include/nvsdk_ngx_params.h)) { throw 'Missing NGX headers' }

      - name: Fetch pinned OpenVR header
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force external/openvr | Out-Null
          curl.exe -fsSL -o external/openvr/openvr.h `
            "https://raw.githubusercontent.com/ValveSoftware/openvr/$env:OPENVR_TAG/headers/openvr.h"
          if ($LASTEXITCODE -ne 0) { throw 'OpenVR header download failed' }
          $hash = (Get-FileHash external/openvr/openvr.h -Algorithm SHA256).Hash
          if ($hash -ne $env:OPENVR_SHA256) { throw "OpenVR checksum mismatch: $hash" }

      - name: Find original Microsoft fxc shader compiler
        id: fxc
        shell: pwsh
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\fxc.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'No fxc.exe found in Windows SDK' }
          "path=$($fxc.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using: $($fxc.FullName)"

      - name: Build and test four pose-motion variants separately
        shell: pwsh
        run: |
          $modes = @(
            @{ Name = '01-stock'; Number = 0 },
            @{ Name = '02-pose-only'; Number = 1 },
            @{ Name = '03-motion-aware'; Number = 2 },
            @{ Name = '04-adaptive'; Number = 3 }
          )
          $shaderHashes = @{}
          foreach ($mode in $modes) {
            $modeName = $mode.Name
            $number = $mode.Number
            $build = 'build-ab'
            Write-Host "========== $modeName (shader mode $number) =========="
            if (Test-Path $build) { Remove-Item -Recurse -Force $build }
            cmake -S . -B $build -G 'Visual Studio 17 2022' -A x64 `
              -DXRFG_FXC_EXECUTABLE="${{ steps.fxc.outputs.path }}" `
              -DXRFG_HEAD_MOTION_MODE="$number"
            if ($LASTEXITCODE -ne 0) { throw "CMake failed: $modeName" }
            if (-not (Select-String -Path "$build/CMakeCache.txt" `
                -Pattern "XRFG_HEAD_MOTION_MODE:STRING=$number" -Quiet)) {
              throw "Wrong CMake mode in $modeName"
            }
            cmake --build $build --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $modeName" }
            $header = "$build/generated-shaders/synthesize_midpoint_pixel_shader.hpp"
            if (-not (Test-Path $header)) { throw "Missing compiled FidelityFX synthesis shader: $modeName" }
            $shaderHashes[$modeName] = (Get-FileHash $header -Algorithm SHA256).Hash
            # Stock shaders must pass the complete supported suite.
            # The two experimental shaders intentionally change synthetic pixel
            # output, invalidating two upstream image-quality regression oracles:
            # xrfg_d3d12_history_tests and xrfg_d3d12_hybrid_composition.
            # Do NOT claim those pass for experimental modes. Every other
            # supported test still runs and fails the job on regression.
            $ctestArgs = @('--test-dir', $build, '-C', 'Release',
              '--output-on-failure', '--timeout', '300', '-LE', 'needs_gpu_timing')
            $resultFile = "dist/OFXR-V577-PoseMotion-Prototype/$modeName-TESTS.txt"
            New-Item -ItemType Directory -Force 'dist/OFXR-V577-PoseMotion-Prototype' | Out-Null
            if ($number -eq 0) {
              "FULL upstream CTest suite (except GPU-timing-labeled tests)." |
                Set-Content -Encoding utf8 $resultFile
            } else {
              $ctestArgs += @('-E', '^xrfg_d3d12_(history_tests|hybrid_composition)$')
              Write-Warning (('Two pixel-output tests are NOT RUN for {0}: ' +
                'xrfg_d3d12_history_tests; xrfg_d3d12_hybrid_composition. ' +
                'Original expected images are incompatible with the intentional shader experiment.') -f $modeName)
              @"
          Variant $modeName (compile-time shader mode $number)
          NOT RUN: xrfg_d3d12_history_tests; xrfg_d3d12_hybrid_composition.
          Reason: upstream tests assert original frame reconstruction pixel values;
          this variant deliberately alters those values.
          All other enabled non-GPU-timing CTests must pass.
          A Windows GPU/VR visual correctness verdict is NOT established by this run.
          "@ | Set-Content -Encoding utf8 $resultFile
            }
            & ctest @ctestArgs
            if ($LASTEXITCODE -ne 0) { throw "Supported tests failed: $modeName" }
            $out = "dist/OFXR-V577-PoseMotion-Prototype/$modeName"
            New-Item -ItemType Directory -Force "$out/ofxr", "$out/licenses", `
              "$out/external/OpenXR-SDK/LICENSES", "$out/external/Vulkan-Headers" | Out-Null
            Copy-Item "$build/Release/OFXRBridgeTray.exe" $out
            Copy-Item "$build/Release/ofxr/XR_APILAYER_XRFrameBridge_diagnostic.dll", `
              "$build/Release/ofxr/OFXR_vulkan_queue_layer.dll", `
              "$build/Release/ofxr/ofxr_bridge.ini" "$out/ofxr"
            Copy-Item README.md, LICENSE, THIRD_PARTY.md $out
            Copy-Item licenses/* "$out/licenses"
            Copy-Item external/OpenXR-SDK/LICENSES/* "$out/external/OpenXR-SDK/LICENSES"
            Copy-Item external/Vulkan-Headers/LICENSE.md "$out/external/Vulkan-Headers"
            @"
          UNSIGNED experimental build, NOT an official OFXR release.
          Variant: $modeName; mode=$number.
          Original source: djules75/OFXR-Bridge V577 commit $env:UPSTREAM_COMMIT.
          Mode 0 = stock V577 pixels (timing diagnostics); mode 1 = pose-only source selection;
          mode 2 = motion-confidence reconstruction; mode 3 = cadence-adaptive fallback.
          Only run one variant; keep SSW off while OFXR is armed.
          Neither head-pose prediction at display time nor true headset-side SSW is implemented.
          Not yet validated on actual Pico 4 hardware. Keep the official build as rollback.
          "@ | Set-Content -Encoding utf8 "$out/VARIANT.txt"
            if (-not (Test-Path "$out/ofxr/XR_APILAYER_XRFrameBridge_diagnostic.dll")) {
              throw "Missing experimental layer DLL: $modeName"
            }
            Write-Host "Built/selected-tests-passed/staged $modeName | shader SHA256 $($shaderHashes[$modeName])"
            # Reclaim Windows runner disk space before building the next variant.
            Remove-Item -Recurse -Force $build
          }
          if (($shaderHashes.Values | Select-Object -Unique).Count -ne $modes.Count) {
            throw 'At least two modes compiled to identical FidelityFX shader bytecode'
          }
          $root = 'dist/OFXR-V577-PoseMotion-Prototype'
          Copy-Item pose_motion_v577.patch "$root/experiment.patch"
          Copy-Item apply_pose_motion_v577.py "$root/apply_pose_motion_v577.py"
          @'
          OFXR V577 POSE/MOTION PROTOTYPE COMPARISON (UNSIGNED)

          01-stock: original V577 reconstruction baseline, plus extra telemetry.
          02-pose-only: selects real A or B camera-pose-aligned source (no flow),
            deliberately jerky; does NOT estimate target headset display pose.
          03-motion-aware: retain FidelityFX, reject low-confidence flow near
            strong edges, use a coherent A or B frame mapped to B camera pose.
          04-adaptive: mode 03 plus stronger pose-anchored fallback when per-output
            frame-interpolation fraction deviates >0.10 from ideal cadence.
          TRACE: extra flight-log event presenter_transition result=980:
            a=consecutive app-submitted display-time gap (ns),
            b=application timeline period (ns),
            c low 8 bits=frame multiplier, bit8=over budget, bit9=>2x budget.
            This is NOT physical HMD scanout telemetry or measured headset pose.
          VALIDATION: Stock runs full non-GPU-timing CTest. Experimental modes
            exclude two original pixel-oracle tests (NOT RUN/NOT PASSED),
            but run other upstream non-GPU-timing tests and deterministic
            independent CPU decision tests. Hardware HMD/AMD testing is required.

          Retain the official OFXR build. Each directory is a COMPLETE standalone
          tray+layer; do not copy individual DLLs between variants.
          Close MSFS, exit the old tray, launch new tray, set 72 Hz / VDXR /
          FidelityFX 25% / SSW OFF, then launch MSFS. Verify loaded DLL SHA256
          against SecurityAudit.txt before comparing. Avoid toggling multipliers
          inside a test scene; restart for each run. No elevation of MSFS.
          Compare remote vs demanding airport, slow vs fast head-turn, 2X vs 3X;
          record FPS, native-frame times, visual double edges and flickering.
          '@ | Set-Content -Encoding utf8 "$root/EXPERIMENT_README.txt"
          $hashes = $shaderHashes.GetEnumerator() | Sort-Object Key | ForEach-Object {
            "{0}  {1}" -f $_.Value, $_.Key
          }
          $hashes | Set-Content -Encoding ascii "$root/SHADER_SHA256.txt"
          $checksums = Get-ChildItem $root -File -Recurse |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName | ForEach-Object {
              $rel = $_.FullName.Substring((Resolve-Path $root).Path.Length + 1).Replace('\','/')
              '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $rel
            }
          $checksums | Set-Content -Encoding ascii "$root/SHA256SUMS.txt"
          Write-Host 'All bytecodes differ; baseline full tests passed, experimental modes excluded 2 original pixel oracles per mode.' 

      - name: Audit compiled EXEs and DLLs with Microsoft Defender
        shell: pwsh
        run: |
          # This step DOES NOT assert that an unsigned binary is safe.
          # Fail closed if on-runner anti-malware scanning is unavailable.
          $ErrorActionPreference = 'Stop'
          $auditRoot = 'dist/security-audit'
          New-Item -ItemType Directory -Force $auditRoot | Out-Null
          $report = Join-Path $auditRoot 'SecurityAudit.txt'
          $lines = [System.Collections.Generic.List[string]]::new()
          function Record([string] $message) {
            $lines.Add($message)
            Write-Host $message
            $lines | Set-Content -Path $report -Encoding utf8
          }
          Record ('OFXR V577 PoseMotion Windows binary security audit; UTC: ' + (Get-Date).ToUniversalTime().ToString('o'))
          Record ('Workflow: ' + $env:GITHUB_WORKFLOW)
          Record ('Runner: ' + $env:RUNNER_OS)
          Record ('Commit: ' + $env:UPSTREAM_COMMIT)
          $root = (Resolve-Path 'dist/OFXR-V577-PoseMotion-Prototype').Path
          $binaries = @(Get-ChildItem $root -Recurse -File | Where-Object {
            $_.Extension -in @('.exe', '.dll')
          } | Sort-Object FullName)
          Record ('Binary count: ' + $binaries.Count)
          if ($binaries.Count -ne 12) { throw 'Expected four EXEs and eight DLLs' }
          foreach ($binary in $binaries) {
            $rel = $binary.FullName.Substring($root.Length + 1).Replace('\','/')
            Record ('BIN SHA256=' + (Get-FileHash $binary.FullName -Algorithm SHA256).Hash + '  ' + $rel)
          }
          if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) -or
              -not (Get-Command Start-MpScan -ErrorAction SilentlyContinue) -or
              -not (Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue)) {
            Record 'INDETERMINATE: Microsoft Defender scanning cmdlets are unavailable on this runner'
            throw 'Security audit unavailable. Binary artifact not uploaded.'
          }
          try {
            $status = Get-MpComputerStatus -ErrorAction Stop
            Record ('Defender AMServiceEnabled=' + $status.AMServiceEnabled +
              ' AntivirusEnabled=' + $status.AntivirusEnabled +
              ' SignatureLastUpdated=' + $status.AntivirusSignatureLastUpdated)
            if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
              Record 'INDETERMINATE: Microsoft Defender Antivirus is disabled on this runner'
              throw 'Security audit unavailable. Binary artifact not uploaded.'
            }
            if ($null -eq $status.AntivirusSignatureLastUpdated -or
                $status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-14)) {
              Record 'INDETERMINATE: Antivirus signatures are older than 14 days'
              throw 'Defender signatures too old to permit artifact upload.'
            }
            $auditStart = (Get-Date).AddMinutes(-30)
            foreach ($binary in $binaries) {
              Record ('Scanning ' + $binary.FullName)
              Start-MpScan -ScanType CustomScan -ScanPath $binary.FullName -ErrorAction Stop
              if (-not (Test-Path -LiteralPath $binary.FullName)) {
                Record ('DETECTION OR QUARANTINE: binary disappeared after scanning: ' + $binary.Name)
                throw 'Security scan removed a file. Binary artifact not uploaded.'
              }
            }
            $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
              $_.InitialDetectionTime -ge $auditStart
            })
            foreach ($detection in $detections) {
              Record ('DETECTION: ThreatID=' + $detection.ThreatID +
                ' Time=' + $detection.InitialDetectionTime +
                ' Resources=' + ($detection.Resources -join ';'))
            }
            if ($detections.Count -gt 0) {
              throw 'Defender reported detections. Binary artifact not uploaded.'
            }
            Record 'SCAN RESULT: no recent detections returned by Microsoft Defender on this runner.'
            Record 'LIMITATION: a clean scan is NOT proof of safety; browser warning may remain.'
          } catch {
            Record ('AUDIT FAILED: ' + $_.Exception.Message)
            throw
          }

      - name: Upload source-only security audit report (no binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OFXR-V577-POSEMOTION-SECURITY-AUDIT-TEXT-ONLY
          path: dist/security-audit/SecurityAudit.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload all four ready-to-extract comparison variants
        uses: actions/upload-artifact@v4
        with:
          name: OFXR-V577-PoseMotion-Prototype-UNSIGNED
          path: dist/OFXR-V577-PoseMotion-Prototype/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OFXR-PoseMotion-failed-build-logs
          path: |
            build-ab/Testing/Temporary/LastTest.log
            build-ab/Testing/Temporary/*.log
            build-ab/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
